<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Fashion - Industry Insights</title>
    <!-- Updated fonts for a fashion magazine aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Sleek Fashion Theme */
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --neon-blue: #ff1493; /* Chic Pink */
            --neon-purple: #ffd700; /* Gold */
            --neon-pink: #00ffff; /* Modern Cyan */
            --neon-green: #39ff14; /* Keep green for correct answers */
            --neon-red: #ff073a;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --radius-lg: 4px; /* Sharper, modern edges */
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image: 
              radial-gradient(circle at 15% 40%, rgba(255, 215, 0, 0.05), transparent 30%),
              radial-gradient(circle at 85% 60%, rgba(255, 20, 147, 0.05), transparent 30%);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(18, 18, 18, 0.95);
            border-bottom: 2px solid var(--neon-purple);
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-purple);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--neon-purple);
        }

        #app-container {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: var(--radius-lg);
            padding: 2.2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-purple);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.15);
        }

        .level-card h2, .level-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--text-main);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 2px;
            border: 1px solid #444;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .action-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--text-main);
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 1rem;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
            transform: translateY(-2px);
        }

        .btn-correct { background-color: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
        .btn-wrong { background-color: rgba(255, 7, 58, 0.2) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 2rem;
        }

        .reading-container {
            background: var(--panel-bg);
            padding: 2.2rem;
            border-radius: var(--radius-lg);
            border: 1px solid #333;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .reading-container h2 {
            font-family: 'Playfair Display', serif;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #444;
        }

        .cloud-word {
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #555;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .cloud-word.found {
            background: rgba(255, 215, 0, 0.2);
            color: var(--neon-purple);
            border-color: var(--neon-purple);
            text-decoration: line-through;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-bottom: 1px dotted #888;
            transition: color 0.2s;
        }

        .interactive-word.revealed {
            color: var(--neon-purple);
            font-weight: bold;
            border-bottom: none;
        }

        hr { border: 0; height: 1px; background: #333; margin: 1.8rem 0; }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 1px solid #555;
            background: var(--bg-dark);
            color: var(--text-main);
            margin-top: 1rem;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-purple);
        }

        .flashcard-scene {
            width: 100%;
            height: 360px;
            perspective: 1000px;
            margin: 1.8rem 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid #444;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-main);
            padding: 1.5rem;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--bg-dark);
            border-color: var(--neon-purple);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .flashcard-examples {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
            text-align: left;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .example-en { color: var(--neon-purple); font-weight: bold; }
        .example-zh { color: var(--text-muted); font-size: 0.95rem; }

        .sentence-dropzone, .word-bank {
            min-height: 80px;
            border: 1px dashed #555;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-dark);
        }
        .draggable-word {
            padding: 10px 14px;
            background: var(--panel-bg);
            border: 1px solid #444;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: transform 0.1s;
            user-select: none;
        }
        .draggable-word:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .ai-logo-frame {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: #ffffff;
            padding: 15px;
            border: 1px solid #333;
            margin: 0 auto 1.5rem auto;
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.4s ease-out forwards; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>

    <script>
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#ffffff', '#ffd700', '#aaaaaa'];

            for (let i = 0; i < 30; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    speedY: Math.random() * 0.5 - 0.25,
                    speedX: Math.random() * 0.5 - 0.25,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
        window.addEventListener('resize', () => {

        function checkWord(element) {
            const clickedWord = element.innerText.toLowerCase().trim();
            const matchedVocab = wordsToFind.find(word => {
                if (word === clickedWord) return true;
                const phraseWords = word.split(' ');
                return phraseWords.includes(clickedWord);
            });

            if (matchedVocab) {
                element.classList.add('revealed');
                const cloudEl = document.getElementById(`cloud-${matchedVocab.replace(/\s+/g, '-')}`);
                if (cloudEl && !cloudEl.classList.contains('found')) {
                    cloudEl.classList.add('found');
                    updateXP(5);
                }
            } else {
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 400);
            }
        }

            renderQuiz();

            const qData = currentLevel.questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === currentLevel.questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            let interactionHTML = '';
            
            if (qData.type === 'mc') {

                interactionHTML = `

                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(element, selectedIndex, correctAnswer, type) {
            if (type === 'mc') {
                const allButtons = element.parentElement.querySelectorAll('button');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (selectedIndex === correctAnswer) {
                    element.classList.add('btn-correct');
                    updateXP(15);
                } else {
                    element.classList.add('btn-wrong');
                    element.classList.add('shake');
                    allButtons[correctAnswer].classList.add('btn-correct');
                }
            } else if (type === 'fill') {
                const userAnswer = element.value.trim().toLowerCase();
                const actualAnswer = correctAnswer.toLowerCase();
                if (userAnswer.includes(actualAnswer) || actualAnswer.includes(userAnswer)) {
                    element.style.borderColor = 'var(--neon-green)';
                    element.style.color = 'var(--neon-green)';
                    updateXP(15);
                    alert("Correct!");
                } else {
                    element.style.borderColor = 'var(--neon-red)';
                    element.classList.add('shake');
                    setTimeout(() => element.classList.remove('shake'), 400);
                }
            }
        }

            currentQuestionIndex += direction;
            if (currentQuestionIndex >= currentLevel.questions.length) {

        // --- ACTIVITY 4: UNSCRAMBLE VOCAB ---
        function startVocabUnscramble() {
            if(currentLevel.unscrambleWords.length === 0) {
                alert("Unscramble coming soon!");
                return;
            }
            currentVocabUnscrambleIndex = 0;
            renderVocabUnscramble();
        }

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

        function renderVocabUnscramble() {
            const wordsList = currentLevel.unscrambleWords;
            const originalWord = wordsList[currentVocabUnscrambleIndex];
            const scrambledWord = scrambleString(originalWord);
            
            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="text-align:center;">

        function checkMissionGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');

                setTimeout(() => {

                setTimeout(() => {
                    missionChallengeIndex++;
                    renderMissionChallenge(); 
                }, 2000);
            }
        }

        // --- ACTIVITY 7: EMOJI DECODE CHALLENGE ---
        function startAppChallenge() {
            appChallengeIndex = 0;
            activeSpaceApps = [...spaceAppsDB].sort(() => 0.5 - Math.random());
            renderAppChallenge();
        }

        function renderAppChallenge() {
            if (appChallengeIndex >= activeSpaceApps.length) {
                alert("Emoji Challenge Complete!");
                return renderMenu();
            }

            const currentApp = activeSpaceApps[appChallengeIndex];
            
            let options = [currentApp.name];
            let pool = ALL_SPACE_APPS.filter(n => n !== currentApp.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>EMOJI ${appChallengeIndex + 1} OF ${activeSpaceApps.length}</span>
                    </div>

                    <div id="app-feedback-zone" style="min-height: 200px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--neon-purple); border-radius: 2px; margin-bottom: 1.8rem;">
                        <span style="font-size: 4.5rem; user-select: none;">${currentApp.emoji}</span>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">What does this represent?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.6rem; font-size: 0.95rem; line-height: 1.3;" onclick="checkAppGuess(this, '${opt}', '${currentApp.name}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAppGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('app-feedback-zone');
                feedbackZone.innerHTML = `
                    <span style="display: block; color: var(--neon-red); font-size: 1.2rem; font-weight: bold; margin: 1.5rem 0; font-family: 'Playfair Display', serif;">
                        Incorrect! Represents: ${correct}.
                    </span>`;
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge(); 
                }, 2000);
            }
        }

        // --- ACTIVITY 8: SYNONYM MATCH CHALLENGE ---
        function startSynonymMatch() {
            if (!currentLevel.synonyms || currentLevel.synonyms.length === 0) {
                alert("No synonyms available for this level.");
                return;
            }
            synonymChallengeIndex = 0;
            activeSynonyms = [...currentLevel.synonyms].sort(() => 0.5 - Math.random());
            renderSynonymMatch();
        }

        function renderSynonymMatch() {
            if (synonymChallengeIndex >= activeSynonyms.length) {
                alert("Synonym Challenge Complete. (+50 SP Bonus)");
                updateXP(50);
                return renderMenu();
            }

            const currentPair = activeSynonyms[synonymChallengeIndex];
            
            let options = [currentPair.synonym];
            let pool = currentLevel.synonyms
                .map(s => s.synonym)
                .filter(syn => syn !== currentPair.synonym);
            
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SYNONYM ${synonymChallengeIndex + 1} OF ${activeSynonyms.length}</span>
                    </div>

                    <h2 style="color: #fff; margin-bottom: 0.5rem;">Find the closest synonym for:</h2>
                    
                    <div style="background: rgba(255, 255, 255, 0.05); padding: 1.8rem; border-radius: 2px; margin-bottom: 2rem; border: 1px dotted #666; text-align: center;">
                        <strong style="color: var(--neon-purple); font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase;">
                            ${currentPair.word}
                        </strong>
                    </div>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.2rem; font-size: 1.05rem;" onclick="checkSynonymGuess(this, '${opt}', '${currentPair.synonym}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkSynonymGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(15);
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                btn.classList.add('shake');
                
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('btn-correct');
                    }
                });

                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch(); 
                }, 2000);
            }
        }

        // Initialize application on load
        init();
    </script>
</body>
</html>
